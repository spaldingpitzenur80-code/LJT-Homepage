name: Build check

on:
  push:
    branches: ["master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage" --strict_front_matter
        env:
          JEKYLL_ENV: production
      - name: Inspect built site
        run: |
          find _site -maxdepth 2 -type d | sort
          head -c 1200 _site/index.html
